spring.application.name=auth-service

# Base configuration (local development friendly by default)
# Use -Dspring.profiles.active=prod for production

# Oracle database configuration (localhost for development)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/gen_c23d12a2fecf}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.datasource.driver-class-name=org.postgresql.Driver
server.port=26715

# JWT configuration
app.secret.jwt-signing-key=${JWT_SIGNING_KEY:change-this-development-signing-key-to-a-secure-value}
jwt.expiration-ms=1800000

# AWS Secrets Manager configuration
app.secret.aws-jwt-secret-name=${AWS_JWT_SECRET_NAME:auth-microservice/jwt/keys}

management.endpoints.web.exposure.include=health

# JWT RSA Key paths (for local development - overridden by AWS Secrets Manager in prod)
jwt.private-key-path=keys/private.pem
jwt.public-key-path=keys/public.pem

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always