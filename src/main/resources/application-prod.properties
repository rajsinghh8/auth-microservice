# Production Profile Configuration
# Uses environment variables and production PostgreSQL

# Production database configuration.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/gen_c23d12a2fecf_1}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.datasource.driver-class-name=org.postgresql.Driver

# JWT configuration (uses AWS Secrets Manager)
jwt.private-key-path=keys/private.pem
jwt.public-key-path=keys/public.pem

# Production monitoring
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized 