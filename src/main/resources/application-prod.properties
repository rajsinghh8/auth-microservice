# Production Profile Configuration
# Uses AWS Secrets Manager and production Oracle

# Production database configuration. Set ORACLE_DB_URL for the production Oracle service.
spring.datasource.url=${ORACLE_DB_URL:jdbc:oracle:thin:@//oracle:1521/FREEPDB1}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JWT configuration (uses AWS Secrets Manager)
jwt.private-key-path=keys/private.pem
jwt.public-key-path=keys/public.pem

# Production monitoring
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized 